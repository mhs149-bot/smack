<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0a4a"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c8a8"/>
      <stop offset="100%" stop-color="#d4a078"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f15bb5"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#f15bb5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="520" fill="url(#bg)"/>
  <!-- bar shelves hint -->
  <rect x="20" y="40" width="360" height="14" rx="3" fill="#3d2415"/>
  <rect x="20" y="40" width="360" height="3" fill="#00f5d4" opacity="0.45"/>
  <!-- bottles -->
  <g opacity="0.7">
    <rect x="48" y="8" width="18" height="32" rx="3" fill="#00f5d4"/>
    <rect x="78" y="14" width="16" height="26" rx="3" fill="#f15bb5"/>
    <rect x="106" y="6" width="18" height="34" rx="3" fill="#7b2cbf"/>
    <rect x="280" y="10" width="16" height="30" rx="3" fill="#00f5d4"/>
    <rect x="308" y="4" width="20" height="36" rx="3" fill="#f15bb5"/>
    <rect x="340" y="12" width="16" height="28" rx="3" fill="#c77dff"/>
  </g>
  <!-- shoulders / vest -->
  <ellipse cx="200" cy="430" rx="130" ry="70" fill="#1a0830"/>
  <path d="M90 400 Q200 460 310 400 L300 520 L100 520 Z" fill="#241043"/>
  <path d="M160 410 L200 500 L240 410" fill="none" stroke="url(#neon)" stroke-width="4"/>
  <!-- neck -->
  <rect x="178" y="250" width="44" height="50" rx="12" fill="url(#skin)"/>
  <!-- head -->
  <ellipse cx="200" cy="190" rx="78" ry="92" fill="url(#skin)"/>
  <!-- hair (stylized, not a likeness) -->
  <path d="M120 180 Q110 90 200 70 Q290 90 280 180 Q270 110 200 100 Q130 110 120 180 Z" fill="url(#hair)"/>
  <path d="M125 200 Q100 230 118 280 Q140 250 150 220" fill="#7b2cbf"/>
  <path d="M275 200 Q300 230 282 280 Q260 250 250 220" fill="#7b2cbf"/>
  <!-- lynx ear tufts -->
  <path d="M135 105 L120 55 L155 95 Z" fill="#f15bb5"/>
  <path d="M265 105 L280 55 L245 95 Z" fill="#f15bb5"/>
  <!-- sunglasses -->
  <rect x="145" y="170" width="48" height="28" rx="8" fill="#0a0118" stroke="#00f5d4" stroke-width="3"/>
  <rect x="207" y="170" width="48" height="28" rx="8" fill="#0a0118" stroke="#00f5d4" stroke-width="3"/>
  <rect x="193" y="180" width="14" height="6" rx="2" fill="#00f5d4"/>
  <!-- smile -->
  <path d="M170 230 Q200 252 230 230" fill="none" stroke="#8b4513" stroke-width="4" stroke-linecap="round"/>
  <!-- name tag -->
  <rect x="155" y="455" width="90" height="28" rx="6" fill="#00f5d4"/>
  <text x="200" y="475" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" fill="#0a0118">LYNX</text>
</svg>
